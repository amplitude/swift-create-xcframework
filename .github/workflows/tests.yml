name: Tests

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tests.yml'
      - '**/*.swift'
      - 'Makefile'
      - 'Package.resolved'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/tests.yml'
      - '**/*.swift'
      - 'Makefile'
      - 'Package.resolved'

permissions:
  contents: read

jobs:
  package:
    name: Package Vexil with Xcode 16.3
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode 16.3
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app

      - name: Install platform support
        run: |
          xcrun simctl list > /dev/null
          sudo xcodebuild -downloadPlatform iOS
          sudo xcodebuild -downloadPlatform tvOS
          sudo xcodebuild -downloadPlatform watchOS

      - name: Build swift-create-xcframework
        run: make swift-create-xcframework

      - name: Check out Vexil
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: unsignedapps/Vexil
          ref: db60fb15d99fc63b02252524d2ad31bcf7b8bf33 # v1.2.2
          path: Vexil

      - name: Package Vexil
        working-directory: Vexil
        run: >
          ../.build/release/swift-create-xcframework --zip --zip-version 1.2.2
          --platform ios --platform macos --platform tvos --platform watchos
